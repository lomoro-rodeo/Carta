<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lomoro Cafetería · Carta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#03989e;--gd:#107771;--r:#e86969;--mint:#a9e1ac;--bl:#729dc1;--pk:#e89999;--w:#fff;--bg:#f2fafa;--t:#16312f;--m:#587674;--l:#cfe6e4}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font:16px/1.4 Montserrat,'Proxima Nova',system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--g);color:var(--w);text-align:center;padding:22px 16px 20px;border-bottom:6px solid var(--r)}
.arc{display:block;margin:0 auto -4px;width:70px;height:16px}
header h1{font:800 clamp(38px,11vw,56px)/1 Montserrat,sans-serif;letter-spacing:.03em}
header p{font-weight:600;letter-spacing:.4em;margin:6px 0 16px;font-size:12px}
.s{display:flex;max-width:520px;margin:0 auto;background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.7);border-radius:99px;padding:0 16px;align-items:center;gap:8px;color:#fff}
.s input{flex:1;border:0;outline:0;font:500 16px Montserrat,sans-serif;padding:12px 0;background:none;color:#fff;min-width:0}
.s input::placeholder{color:rgba(255,255,255,.8);opacity:1}
.s button{border:0;background:none;font-size:18px;color:#fff;cursor:pointer;display:none}
nav{position:sticky;top:0;z-index:5;background:var(--w);box-shadow:0 2px 6px rgba(3,152,158,.15);display:flex;gap:6px;overflow-x:auto;padding:8px 10px;scrollbar-width:none}
nav a{flex:none;text-decoration:none;color:var(--gd);background:var(--bg);border-radius:12px;padding:6px 12px;font-weight:700;font-size:13px;text-align:center;line-height:1.2}
nav a span{display:block;font-size:18px}
nav a.on{background:var(--g);color:var(--w)}
nav a:focus-visible{outline:2px solid var(--r)}
main{max-width:720px;margin:0 auto;padding:4px 16px 40px}
section{padding-top:24px}
h2{font:800 20px Montserrat,sans-serif;text-transform:uppercase;color:var(--gd);letter-spacing:.03em;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:3px;background:var(--r);border-radius:2px}
h3{font:700 14px Montserrat,sans-serif;color:var(--w);background:var(--gd);display:inline-block;padding:3px 12px;border-radius:99px;margin:14px 0 2px}
.i{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--l)}
.i div{flex:1}
.i b{font-weight:600}
.i small{display:block;color:var(--m);font-size:13px;margin-top:1px}
.p{font-weight:800;color:var(--gd);white-space:nowrap;background:#e3f6e4;border-radius:8px;padding:2px 9px}
.p.c{background:none;color:var(--m);font-weight:500;font-size:13px}
#no{display:none;text-align:center;padding:40px 0;color:var(--m)}
#up{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;border:0;background:var(--r);color:#fff;font-size:20px;display:none;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
footer{background:var(--gd);color:#d6f0ee;text-align:center;padding:20px 16px;font-size:13px}
.h{display:none!important}
@media(prefers-color-scheme:dark){:root{--bg:#0e1b1b;--w:#152626;--t:#e6f4f3;--m:#9bb8b6;--l:#274140;--gd:#7fd3d0}header{background:#107771}.p{background:#1d3a38}nav a.on{color:#0e1b1b}h3{color:#0e1b1b}}
</style>
</head>
<body>
<header><svg class="arc" viewBox="0 0 70 16"><path d="M2 15Q35-8 68 15" fill="none" stroke="#e86969" stroke-width="5" stroke-linecap="round"/></svg><h1>LOMORO</h1><p>CAFETERÍA</p>
<label class="s"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Buscar: latte, waffle, promo…" autocomplete="off"><button id="x" aria-label="Borrar">✕</button></label></header>
<nav id="nav"></nav>
<main id="m"></main>
<p id="no">No encontramos nada con esa búsqueda.<br>Probá con otra palabra.</p>
<button id="up" aria-label="Volver arriba">↑</button>
<footer>Precios en pesos argentinos · Sujetos a cambios<br>Opciones sin TACC: consultar disponibles</footer>
<script>
const D=[
["infusiones","Infusiones",[
["Tradicionales",[["Café XL",4200],["Café Grande",3700],["Café Mediano",3000],["Café Chico",2800],["Chocolatada",3100],["Té en saquito",1400],["Té en hebras",1800]]],
["Baristas",[["Cappuccino","con cacao y/o canela",4100],["Submarino",4100],["Latte Moka",4200],["Latte Caramel",4200],["Latte Dulce de Leche",4200],["Latte Nutella",4200],["Café Irlandés","con whisky, crema y cacao",5800]]],
["Frías",[["Iced Coffee",5000],["Iced Latte",5000],["Iced Latte Caramel",5300],["Iced Latte Dulce de Leche",5300],["Iced Latte Moka",5300],["Iced Latte Nutella",5300],["Affogato","café espresso y helado de americana",6100]]]]],
["panaderia","Panadería y Pastelería",[
["",[["Medialuna",1000],["Tortita",1000],["Medialuna JyQ",2400],["Tortita JyQ",2400],["Medialuna dulce","con dulce de leche o nutella",2400],["Alfajor de maicena",1900],["Chipa"],["Chipa prensado","con jamón y queso"],["Porción de budín","consultar variedades",3300],["Cupcakes","consultar variedades"],["Porción de torta","Cheesecake de frutos rojos, Chocotorta, Selva Negra, Selva Blanca, Matilda, Limón Cocado, Brownie, Oreo",6900]]]]],
["bebidas","Bebidas frías",[
["Jugos naturales",[["Jugo de naranja grande",3300],["Jugo de naranja mediano",3000],["Limonada grande",3300],["Limonada mediana",3000],["Limonada con frutilla",4100],["Licuados frutales","con leche",4100],["Frappés frutales","con agua",3400]]],
["Aguas y gaseosas",[["Gaseosa 500 ml",2900],["Agua saborizada 500 ml",2600],["Agua mineral sin gas 500 ml",2400],["Agua mineral con gas 500 ml",2400],["Lata gaseosa 350 ml",2400],["Lata Monster 473 ml",5800],["Ades 1 lt",5000],["Ades 200 ml",2000]]]]],
["tostados","Panadería tostada",[
["Tostados",[["Tostado jamón y queso","cuatro triángulos, en pan de miga",7800],["Tostado “simple” de jamón y queso","en pan con semillas",5000]]],
["Tostadas",[["Mermelada · queso crema o manteca","consultar variedad de panes",4200],["Jamón · queso","frío o gratinado",6000]]],
["Tostones",[["Jamón crudo","con aceite de oliva",7900],["Jamón crudo · queso crema · cherrys","opcional rúcula",9100],["Queso crema · cherrys · rúcula"]]]]],
["waffles","Waffles dulces y salados",[
["",[["Banana · dulce de leche",6300],["Banana · salsa dulce · helado",6900],["Frutilla · Nutella · helado",9100],["Frutilla · Nutella",8400],["Frutilla · crema",7800],["Jamón · queso",6900],["Jamón · queso crema · cherrys · rúcula"],["Queso crema · cherrys · rúcula",8400]]]]],
["croissants","Croissants dulces y salados",[
["",[["Banana · dulce de leche",7700],["Frutilla · Nutella",8800],["Frutilla · crema",8800],["Jamón · queso",8400],["Jamón · queso crema · cherrys · rúcula",10000],["Queso crema · cherrys · rúcula",8500]]]]],
["otros","Otros y adicionales",[
["Otros",[["Yogurt con granola y fruta",6000],["Yogurt con granola",5100],["Batido helado","hasta dos sabores",4800],["Frappuccino","café, leche, crema, saborizado a elección",7100]]],
["Adicionales",[["Dip de mermelada",700],["Dip de queso",700],["Dip de manteca",700],["Tostada (1 pan)",600],["Crema batida",2000],["Bocha de helado",2700],["Barra de chocolate",1000]]]]],
["combos","Especiales",[
["",[["Fresh","Licuado frutal + tostado simple",8200],["Fit","Yogurt con granola y fruta + café grande + jugo mediano",11000],["Chipa clásica","Café grande + 2 chipa + jugo mediano"],["Iced Latte","Infusión fría (a elección) + cupcake o 2 chipa"]]]]],
["promos","Promos tradicionales",[
["",[["Promo 1","Jugo grande + tostado JyQ",9900],["Promo 2","Café grande + tostado JyQ",10300],["Promo 3","Submarino o cappuccino + tostado JyQ",10700],["Promo 4","Submarino o cappuccino + 2 medialunas/tortitas + jugo mediano",8100],["Promo 5","Café grande + 2 medialunas/tortitas + jugo mediano",7700],["Promo 6","Café grande + porción de torta + jugo mediano",12000],["Promo 7","Café grande + 2 medialunas JyQ + jugo mediano",10200],["Promo 8","Submarino o cappuccino + alfajor de maicena",5600],["Promo 9","Café grande + porción de budín o cupcake",6600],["Promo 10","Té en saquito + porción de budín o cupcake",4200],["Promo 11","Café mediano + 1 medialuna/tortita + jugo mediano",6200]]]]],
["barista","Promos “Barista”",[
["Infusión barista incluida",[["Croissant dulce","Croissant (banana, dulce de leche) + jugo mediano",12900],["Croissant salado","Croissant (jamón, queso crema, cherrys, rúcula) + jugo mediano",15600],["Tostadas dulces","Tostadas (mermelada, queso) + jugo mediano",10100],["Tostadas saladas","Tostadas (jamón, queso) + jugo mediano",11800],["Waffle dulce","Waffle (banana, dulce de leche) + jugo mediano",12000],["Waffle salado","Waffle (jamón, queso) + jugo mediano",12600],["Torta","Porción de torta (a elección) + jugo mediano",12500],["Chipa","Chipa prensado + jugo mediano"]]]]],
["extras","Desayuno, llevar y compartir",[
["Promo desayuno time",[["Café grande + 2 medialunas/tortitas o 1 y 1","disponible hasta las 13 hs",4700]]],
["Para llevar",[["Café grande",3700],["Café chico",3200]]],
["Para compartir",[["Opción A","2 jugos grandes (naranja o limonada) + 1 tostado JyQ",13000],["Opción B","2 cafés grandes + 1 tostado JyQ",13800],["Opción C","2 batidos helados + 1 tostado JyQ",15600],["Opción D","2 cafés grandes + 2 waffles (jamón, queso)",19000],["Opción E","2 cafés grandes + 1 croissant (frutilla, nutella, crema)",16000],["Opción F","2 cafés grandes + 4 tostadas + dips de mermelada y queso crema",14300]]]]]
];
const $=s=>document.getElementById(s),f=n=>"$"+n.toLocaleString("es-AR");
const L={infusiones:["☕","Cafés"],panaderia:["🥐","Pastelería"],bebidas:["🥤","Bebidas"],tostados:["🥪","Tostados"],waffles:["🧇","Waffles"],croissants:["🥐","Croissants"],otros:["🍨","Otros"],combos:["⭐","Especiales"],promos:["🏷️","Promos"],barista:["💚","Barista"],extras:["🎁","Combos"]};
let nav="",h="";
for(const[id,t,gs]of D){
nav+=`<a href="#${id}" data-id="${id}"><span>${L[id][0]}</span>${L[id][1]}</a>`;
h+=`<section id="${id}"><h2>${t}</h2>`;
for(const[gt,items]of gs){
h+=`<div class="g">`+(gt?`<h3>${gt}</h3>`:"");
for(const it of items){
const[n,...r]=it,p=r.find(x=>typeof x=="number"),d=r.find(x=>typeof x=="string");
h+=`<div class="i" data-k="${(n+" "+(d||"")+" "+gt+" "+t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}"><div><b>${n}</b>${d?`<small>${d}</small>`:""}</div><span class="p${p?"":" c"}">${p?f(p):"Consultar"}</span></div>`}
h+="</div>"}
h+="</section>"}
$("nav").innerHTML=nav;$("m").innerHTML=h;
const q=$("q"),norm=v=>v.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
q.oninput=()=>{const v=norm(q.value);$("x").style.display=v?"block":"none";let any=0;
document.querySelectorAll(".i").forEach(e=>{const ok=!v||e.dataset.k.includes(v);e.classList.toggle("h",!ok)});
document.querySelectorAll(".g").forEach(g=>g.classList.toggle("h",!g.querySelector(".i:not(.h)")));
document.querySelectorAll("section").forEach(s=>{const ok=s.querySelector(".i:not(.h)");s.classList.toggle("h",!ok);if(ok)any=1});
$("no").style.display=any?"none":"block"};
$("x").onclick=()=>{q.value="";q.oninput();q.focus()};
const secs=[...document.querySelectorAll("section")],links=[...document.querySelectorAll("nav a")];
addEventListener("scroll",()=>{let c=secs[0].id;for(const s of secs)if(!s.classList.contains("h")&&s.getBoundingClientRect().top<120)c=s.id;
links.forEach(a=>{const on=a.dataset.id==c;a.classList.toggle("on",on);if(on&&!q.value){const n=$("nav");n.scrollTo({left:a.offsetLeft-n.clientWidth/2+a.clientWidth/2})}});
$("up").style.display=scrollY>500?"block":"none"},{passive:true});
$("up").onclick=()=>scrollTo({top:0});
dispatchEvent(new Event("scroll"));
</script>
</body>
</html>
